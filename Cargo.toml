[package]
name = "crystal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "One terminal for all your coding agents"
license = "MIT"
repository = "https://github.com/gabalexander/crystal"
readme = "README.md"
keywords = ["agents", "terminal", "tui", "multiplexer", "claude"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
libc = "0.2.190"
portable-pty = "0.9.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3.27.0"
