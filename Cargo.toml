[package]
name = "crystal"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "One terminal for all your coding agents"
license = "MIT"
repository = "https://github.com/gabalexander/crystal"
readme = "README.md"
keywords = ["agents", "terminal", "tui", "multiplexer", "claude"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
candle-core = "0.10"
candle-nn = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
libc = "0.2.190"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
regex = "1.13.1"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
similar = "3.2.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-width = "0.2"

# On a Mac, the models that search memory by meaning run on its GPU.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.10", features = ["metal"] }
candle-nn = { version = "0.10", features = ["metal"] }

[dev-dependencies]
tempfile = "3.27.0"
vt100 = "0.16.2"
